<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S1 WebGL check</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1c1c1a; --muted: #5d5d58; --line: #d6d6d0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1a1a18; --fg: #ecece6; --muted: #a3a39c; --line: #3a3a36; } }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 16px; }
  canvas { display: block; width: 100%; aspect-ratio: 16 / 10; border: 1px solid var(--line); border-radius: 6px; }
  pre { margin: 16px 0 0; padding: 12px; border: 1px solid var(--line); border-radius: 6px; white-space: pre-wrap; font: 13px/1.5 ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<main>
  <h1>Sanďbox S1 — WebGL v relaci oblasti</h1>
  <p>Lokální stránka bez sítě (GUI-08, GUI-09). Po 5 s vypíše renderer a skutečně vykreslené snímky; výsledek zkopíruj do protokolu.</p>
  <canvas id="canvas"></canvas>
  <pre id="result">Měřím…</pre>
</main>
<script>
"use strict";
const canvas = document.getElementById("canvas");
const result = document.getElementById("result");
const scale = window.devicePixelRatio || 1;
canvas.width = Math.round(canvas.clientWidth * scale);
canvas.height = Math.round(canvas.clientHeight * scale);

// A context that refuses a major performance caveat fails where the browser would fall back
// to software rendering: the decisive signal for GUI-05 in a browser.
const accelerated = canvas.getContext("webgl2", { failIfMajorPerformanceCaveat: true });
const gl = accelerated || canvas.getContext("webgl2");
const report = {
  userAgent: navigator.userAgent,
  devicePixelRatio: scale,
  drawingBuffer: `${canvas.width}x${canvas.height}`,
  webgl2: Boolean(gl),
  acceleratedContext: Boolean(accelerated),
};

if (!gl) {
  result.textContent = JSON.stringify(report, null, 2);
} else {
  const info = gl.getExtension("WEBGL_debug_renderer_info");
  report.vendor = gl.getParameter(info ? info.UNMASKED_VENDOR_WEBGL : gl.VENDOR);
  report.renderer = gl.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : gl.RENDERER);

  const compile = (type, source) => {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    return shader;
  };
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, `#version 300 es
    void main() {
      vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
      gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
    }`));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, `#version 300 es
    precision highp float;
    uniform float time;
    out vec4 color;
    void main() {
      vec2 p = gl_FragCoord.xy / 200.0;
      float v = sin(p.x + time * 3.0) + sin(p.y * 1.3 - time * 2.0) + sin((p.x + p.y) * 0.7 + time);
      color = vec4(0.5 + 0.5 * sin(v), 0.5 + 0.5 * sin(v + 2.1), 0.5 + 0.5 * sin(v + 4.2), 1.0);
    }`));
  gl.linkProgram(program);
  gl.useProgram(program);
  const timeUniform = gl.getUniformLocation(program, "time");

  const seconds = 5;
  const frameTimes = [];
  const start = performance.now();
  const frame = (now) => {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform1f(timeUniform, (now - start) / 1000);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    frameTimes.push(now);
    if (now - start < seconds * 1000) {
      requestAnimationFrame(frame);
      return;
    }
    const intervals = frameTimes.slice(1).map((t, i) => t - frameTimes[i]).sort((a, b) => a - b);
    report.seconds = seconds;
    report.frames = frameTimes.length;
    report.framesPerSecond = +(frameTimes.length / seconds).toFixed(1);
    report.intervalMedianMs = +intervals[Math.floor(intervals.length / 2)].toFixed(2);
    report.intervalP95Ms = +intervals[Math.min(intervals.length - 1, Math.ceil(intervals.length * 0.95) - 1)].toFixed(2);
    report.documentVisible = document.visibilityState === "visible";
    result.textContent = JSON.stringify(report, null, 2);
  };
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
