name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  packages:
    name: Discover Swift packages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      run: ${{ steps.discover.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request merge commit and its base parent, to list the changed files.
          fetch-depth: 2
          persist-credentials: false
      - name: Select the packages to build and test
        id: discover
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import PurePosixPath
          import posixpath
          import re
          import subprocess

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True).stdout

          files = git("ls-files", "-z").split("\0")
          packages = sorted({str(PurePosixPath(path).parent) for path in files if PurePosixPath(path).name == "Package.swift"})
          if not packages:
              raise SystemExit("No Swift packages found; refusing an empty test matrix")
          dependents = {package: set() for package in packages}
          for package in packages:
              manifest = open(posixpath.join(package, "Package.swift"), encoding="utf-8").read()
              for target in re.findall(r'\.package\(\s*path:\s*"([^"]+)"', manifest):
                  dependency = posixpath.normpath(posixpath.join(package, target))
                  if dependency not in dependents:
                      raise SystemExit(f"{package} depends on unknown package {dependency}")
                  dependents[dependency].add(package)

          # Pull requests test only packages they can affect; main, merge queue and manual runs test all.
          selected, reason = set(packages), f"{os.environ['EVENT']}: every package"
          parents = git("rev-list", "--parents", "-n", "1", "HEAD").split()
          if os.environ["EVENT"] == "pull_request" and len(parents) == 3:
              changed = [path for path in git("diff", "--no-renames", "--name-only", "HEAD^1", "HEAD").splitlines() if path]
              if any(path.startswith(".github/") for path in changed):
                  reason = "pull request changes CI: every package"
              else:
                  owners = {max((p for p in packages if path.startswith(p + "/")), key=len, default=None) for path in changed}
                  selected, pending = set(), [owner for owner in owners if owner]
                  # H1 compiles B3 sources/examples as an independent parity oracle. This is a
                  # test-only dependency, deliberately absent from SwiftPM's runtime graph.
                  if any(path.startswith(("spikes/s4-state/Sources/", "spikes/s4-state/examples/"))
                         or path == "spikes/s4-state/SCHEMA.md" for path in changed):
                      if "proto/contracts" not in dependents:
                          raise SystemExit("B3 changes require the proto/contracts parity test package")
                      pending.append("proto/contracts")
                  while pending:
                      package = pending.pop()
                      if package not in selected:
                          selected.add(package)
                          pending.extend(dependents[package])
                  reason = f"pull request changes {len(changed)} files: affected packages, parity consumers and their dependents"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"package": sorted(selected)}) + "\n")
              output.write(f"run={'true' if selected else 'false'}\n")
          print(reason)
          print("Packages:", ", ".join(sorted(selected)) or "none")
          PY

  swift-tests:
    name: Swift (${{ matrix.package }}, ${{ matrix.configuration }})
    needs: packages
    if: ${{ needs.packages.outputs.run == 'true' }}
    # Apple Silicon + macOS 27 / Xcode 27, matching docs/GUIDE.md.
    # This GitHub-hosted image is currently in public preview.
    runs-on: xcode-27
    # A3 also builds pinned OpenSSL in owned temp storage; see its measured VALIDATION budget.
    # A hung Swift test is stopped by the watchdog below; keep the whole job bounded.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.matrix).package }}
        configuration: [debug, release]
    env:
      PACKAGE_PATH: ${{ matrix.package }}
      CONFIGURATION: ${{ matrix.configuration }}
      CI_LOG_DIR: ${{ github.workspace }}/ci-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and record the environment
        run: |
          set -euo pipefail
          mkdir -p "$CI_LOG_DIR"
          {
            sw_vers
            uname -m
            xcodebuild -version
            xcrun swift --version
            /usr/bin/openssl version
          } | tee "$CI_LOG_DIR/environment.log"
          [[ "$(uname -m)" == arm64 ]]
          [[ "$(sw_vers -productVersion)" == 27.* ]]
          [[ "$(xcodebuild -version)" == Xcode\ 27.* ]]
      - name: Provision approved A3 libcrypto
        if: ${{ matrix.package == 'spikes/s1-rfb' }}
        run: |
          set -euo pipefail
          # stdout is the owned root even if a later provisioning command fails.
          /bin/bash spikes/s1-rfb/scripts/provision-openssl.sh --apply > "$CI_LOG_DIR/openssl-root.txt"
          printf 'A3_OPENSSL_ROOT=%s\n' "$(cat "$CI_LOG_DIR/openssl-root.txt")" >> "$GITHUB_ENV"
      - name: Build all products
        run: |
          set -euo pipefail
          if [[ "$PACKAGE_PATH" == spikes/s1-rfb ]]; then
            /bin/bash spikes/s1-rfb/scripts/swift-with-openssl.sh --apply "$A3_OPENSSL_ROOT" "$CONFIGURATION" build \
              2>&1 | tee "$CI_LOG_DIR/build.log"
          else
            swift build --package-path "$PACKAGE_PATH" --configuration "$CONFIGURATION" \
              2>&1 | tee "$CI_LOG_DIR/build.log"
          fi
      - name: Run all tests
        run: |
          set -euo pipefail
          # The slowest package needs about 80 s. A test that hangs fails after 5 minutes with
          # bounded diagnostics of its owned process scope in the uploaded logs.
          if [[ "$PACKAGE_PATH" == spikes/s1-rfb ]]; then
            .github/scripts/run-with-watchdog.sh 300 "$CI_LOG_DIR" \
              /bin/bash spikes/s1-rfb/scripts/swift-with-openssl.sh --apply "$A3_OPENSSL_ROOT" "$CONFIGURATION" test \
              --xunit-output "$CI_LOG_DIR/tests.xml" 2>&1 | tee "$CI_LOG_DIR/tests.log"
          else
            .github/scripts/run-with-watchdog.sh 300 "$CI_LOG_DIR" \
              swift test --package-path "$PACKAGE_PATH" --configuration "$CONFIGURATION" \
              --xunit-output "$CI_LOG_DIR/tests.xml" 2>&1 | tee "$CI_LOG_DIR/tests.log"
          fi
      - name: Retain A3 provisioning evidence
        if: ${{ always() && matrix.package == 'spikes/s1-rfb' }}
        run: |
          set -euo pipefail
          if [[ -s "$CI_LOG_DIR/openssl-root.txt" ]]; then
            root=$(cat "$CI_LOG_DIR/openssl-root.txt")
            [[ "$root" == /private/tmp/sanjbox-a3-openssl-3.5.9.* && -d "$root" && ! -L "$root" ]]
            [[ "$(stat -f '%u %Lp' "$root")" == "$(id -u) 700" ]]
            cp -R "$root/logs" "$CI_LOG_DIR/openssl"
            cp -R "$root/state" "$CI_LOG_DIR/openssl-state"
          fi
      - name: Upload logs and test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-${{ strategy.job-index }}-${{ matrix.configuration }}
          path: ${{ env.CI_LOG_DIR }}/
          if-no-files-found: warn
          retention-days: 14

  python-tests:
    # Repository tooling and CI watchdog regression tests (including Linux).
    name: Python (tools/tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # Same version as the Development progress workflow that builds the website.
          python-version: '3.11'
      - name: Run all tests
        run: python -m unittest discover -s tools/tests -v

  spike-python-tests:
    # Spike tooling written for the macOS system Python (e.g. spikes/s3-pf/load.sh).
    # Tests may use Darwin-only APIs, so they run on the same macOS image as Swift.
    name: Python (spikes, macOS)
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run watchdog regression tests with the macOS system Python
        run: /usr/bin/python3 -I -B -m unittest discover -s tools/tests -p test_watchdog.py -v
      - name: Run every tracked spike test directory with /usr/bin/python3
        run: |
          set -euo pipefail
          sw_vers -productVersion
          /usr/bin/python3 --version
          [[ "$(uname -m)" == arm64 ]]
          dirs=$(git ls-files -- ':(glob)spikes/**/test*.py' | sed 's|/[^/]*$||' | sort -u)
          if [[ -z "$dirs" ]]; then
            echo "No tracked Python tests under spikes/"
            exit 0
          fi
          while IFS= read -r dir; do
            echo "::group::$dir"
            /usr/bin/python3 -I -B -m unittest discover -s "$dir" -v
            echo "::endgroup::"
          done <<< "$dirs"

  required:
    # Stable required status check; keep this in sync with the main ruleset.
    name: CI required
    if: ${{ always() }}
    needs: [packages, swift-tests, python-tests, spike-python-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PACKAGES_RESULT: ${{ needs.packages.result }}
      SWIFT_SELECTED: ${{ needs.packages.outputs.run }}
      TESTS_RESULT: ${{ needs.swift-tests.result }}
      PYTHON_RESULT: ${{ needs.python-tests.result }}
      SPIKE_PYTHON_RESULT: ${{ needs.spike-python-tests.result }}
    steps:
      - name: Require every build and test job to succeed
        run: |
          set -euo pipefail
          echo "Package discovery: $PACKAGES_RESULT"
          echo "Builds and tests: $TESTS_RESULT (packages selected: $SWIFT_SELECTED)"
          # A pull request that touches no Swift package skips the Swift jobs; nothing else may skip.
          if [[ "$SWIFT_SELECTED" == false && "$TESTS_RESULT" == skipped ]]; then TESTS_RESULT=success; fi
          echo "Python tests: $PYTHON_RESULT"
          echo "Spike Python tests: $SPIKE_PYTHON_RESULT"
          [[ "$PACKAGES_RESULT" == success && "$TESTS_RESULT" == success && "$PYTHON_RESULT" == success \
            && "$SPIKE_PYTHON_RESULT" == success ]]
